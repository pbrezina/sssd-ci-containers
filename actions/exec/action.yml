name: 'Execute script inside a container'
inputs:
  script:
    description: Script to run.
    required: true
  where:
    description: Which container(s) will run the script.
    required: false
    default: client
  user:
    description: User that will be used to run the script.
    required: false
    default: ci
  log-file:
    description: Path to the log file where the output will be stored.
    required: false
  working-directory:
    description: Working directory.
    required: false
    default: /
runs:
  using: "composite"
  steps:
  - name: Create temporary script
    shell: bash
    id: script
    env:
      script: ${{ inputs.script }}
    run: |
      file=`mktemp`
      echo -e "$script" > "$file"
      echo "path=$file" >> $GITHUB_OUTPUT

  - name: Copy file to the container
    shell: bash
    env:
      path: ${{ steps.script.outputs.path }}
      where: ${{ inputs.where }}
    run: |
      for container in $where; do
        echo -e ::group::Preparing container: $container
        sudo podman cp "$path" "$container:$path"
        sudo podman exec "$container" chmod a=rx "$path"
        echo ::endgroup::
      done

  - name: Execute command
    shell: bash
    env:
      path: ${{ steps.script.outputs.path }}
      user: ${{ inputs.user }}
      where: ${{ inputs.where }}
      log: ${{ inputs.log-file }}
      workdir: ${{ inputs.working-directory }}
    run: |
      set -ex -o pipefail
      [[ ! -z $log ]] && log=\"$log\"

      # Start all commands in parallel and capture output
      pids=()
      outputs=()
      for container in $where; do
        output_file=$(mktemp)
        outputs+=("$container:$output_file")

        (
          sudo podman exec                                 \
            --user "$user"                                 \
            --env "USER=$user"                             \
            --workdir "$workdir"                           \
            "$container" /bin/bash -c "$path" &> "$output_file"
          echo $? > "$output_file.exit_code"
        ) &
        pids+=($!)
      done

      # Wait for all parallel commands to complete
      for pid in "${pids[@]}"; do
        wait "$pid"
      done

      # Print outputs
      overall_exit_code=0
      for output_info in "${outputs[@]}"; do
        container="${output_info%%:*}"
        output_file="${output_info##*:}"
        exit_code=`cat "$output_file.exit_code"`

        echo -e "::group::Output from: $container (exit code: $exit_code)"
        cat "$output_file"
        echo "::endgroup::"

        if [ ! -z $log ]; then
          cat "$output_file" > "$log.$container"
        fi

        # Track overall exit code
        if [ $exit_code -ne 0 ]; then
          overall_exit_code=$exit_code
        fi
      done

      exit $overall_exit_code
